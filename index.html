<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>만다라 온실 개인정보처리방침</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b0b0b;
    color:#d4af37;
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.8;
    padding:30px 40px;
}

.container{
    max-width:800px;
    margin:0 auto;
}

.header{
    text-align:center;
    margin-bottom:40px;
}

h1{
    font-size:32px;
    font-weight:500;
    color:#f5d76e;
    margin-bottom:6px;
}

.subtitle{
    color:#c5a75a;
    margin-bottom:8px;
}

.date{
    font-size:13px;
    color:#8e7740;
}

.card{
    padding:12px 0;
}

.card h2{
    font-size:20px;
    font-weight:500;
    color:#f5d76e;
    margin-bottom:4px;
}

.card p{
    font-size:16px;
    color:#d4af37;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding-top:20px;
    color:#8e7740;
    font-size:12px;
}

@media (max-width:768px){

    body{
        padding:24px;
    }

    .header{
        text-align:center;
        margin-bottom:20px;
    }

    h1{
        font-size:24px;
    }

    .card h2{
        font-size:15px;
    }

    .card p{
        font-size:13px;
    }
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>만다라 온실</h1>
        <div class="subtitle">개인정보처리방침</div>
        <div class="date">최종 수정일 : 2026-08-14</div>
    </div>

    <div class="card">
        <h2>개인정보 수집 여부</h2>
        <p>
            만다라 온실은 사용자의 개인정보를 수집하거나 저장하지 않습니다.
        </p>
    </div>

    <div class="card">
        <h2>회원가입</h2>
        <p>
            본 앱은 회원가입 및 로그인 기능을 제공하지 않습니다.
        </p>
    </div>

    <div class="card">
        <h2>데이터 저장</h2>
        <p>
            사용자가 생성한 데이터는 사용자의 기기에만 저장되며 외부 서버로 전송되지 않습니다.
        </p>
    </div>

    <div class="card">
        <h2>문의</h2>
        <p>
            공식 커뮤니티를 통해 문의하실 수 있습니다.
        </p>
         <p>
            운영자 : 만실
        </p>
    </div>

    <div class="footer">
        Mandala Onsil © 2026
    </div>

</div>

</body>
</html>
